# /etc/nginx/sites-available/leadhunt
# Symlink: sudo ln -s /etc/nginx/sites-available/leadhunt /etc/nginx/sites-enabled/
# Live host: mailsender.vvmtechnologies.com  →  66.116.249.96 (A record already set).

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name mailsender.vvmtechnologies.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mailsender.vvmtechnologies.com;

    # ── SSL (paths from certbot) ──
    ssl_certificate     /etc/letsencrypt/live/mailsender.vvmtechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mailsender.vvmtechnologies.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # ── Limits ──
    client_max_body_size 20M;           # for CSV/Excel uploads
    proxy_read_timeout 180;             # long for AI/scrape endpoints
    proxy_send_timeout 180;
    keepalive_timeout 65;

    # ── Static files (collected via collectstatic) ──
    location /static/ {
        alias /opt/leadhunt/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ── Media files (user uploads) ──
    location /media/ {
        alias /opt/leadhunt/media/;
        expires 7d;
    }

    # ── Disable buffering for SSE if you re-enable it ──
    location = /notifications/stream/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
    }

    # ── Everything else → Gunicorn ──
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── Security headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
}
