# Nginx for mailsender.vvmtechnologies.com — the LeadHunt dashboard.
#
# Shares 66.116.249.96 with thechatnest.com, visitorconnect and
# vvmtechnologies.com. Name-based virtual hosting keeps them separate; SNI
# lets one address serve many certificates, so no extra IP is needed.
#
# vvmtechnologies.com itself is a Next.js app on :3000 and is NOT touched by
# this file — that vhost's server_name has no wildcard, so this subdomain
# only matches here.
#
# Gunicorn listens on 127.0.0.1:8011. Port 8001 is already taken by the
# daphne process serving another site, hence GUNICORN_BIND in .env.
#
# Install:
#   cp deploy/nginx-mailsender.conf /etc/nginx/sites-available/mailsender
#   ln -s /etc/nginx/sites-available/mailsender /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# HTTPS: run certbot AFTER this is live on :80. It rewrites this block to
# listen on 443 and adds the 80→443 redirect itself, so no TLS path is
# hard-coded here — same approach as the other vhosts on this box.
#   certbot --nginx -d mailsender.vvmtechnologies.com

upstream mailsender_app {
    server 127.0.0.1:8011;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mailsender.vvmtechnologies.com;

    access_log /var/log/nginx/mailsender-access.log;
    error_log  /var/log/nginx/mailsender-error.log;

    # CSV/Excel lead imports come through here.
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # WhiteNoise also serves these, but off-disk is cheaper than waking a
    # worker. Hashed filenames from collectstatic, so cache hard.
    location /static/ {
        alias /opt/leadhunt/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /opt/leadhunt/media/;
        expires 7d;
    }

    # The open-tracking pixel must never be cached, or repeat opens vanish.
    location ~ ^/t/o/ {
        proxy_pass http://mailsender_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    # Server-sent events: buffering off, or the stream never flushes.
    location = /notifications/stream/ {
        proxy_pass http://mailsender_app;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://mailsender_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # Scraping and AI endpoints can run long.
        proxy_read_timeout 180;
        proxy_send_timeout 180;
    }
}
