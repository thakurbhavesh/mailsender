<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — LeadHunt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            min-height: 100vh;
            display: grid; place-items: center;
            color: #0f172a; padding: 20px;
        }
        .login-card {
            background: white; padding: 44px 38px;
            border-radius: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            width: 100%; max-width: 420px;
        }
        .logo {
            display: flex; align-items: center; gap: 12px; margin-bottom: 28px;
        }
        .logo-icon {
            width: 50px; height: 50px; border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            display: grid; place-items: center;
            color: white; font-size: 24px;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }
        .logo-text { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        .logo-sub { font-size: 11px; color: #64748b; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1.5px; margin-top: 2px; }
        h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; color: #334155; }
        input[type=text], input[type=password] {
            width: 100%; padding: 12px 14px;
            border: 1.5px solid #e2e8f0; border-radius: 10px;
            font-size: 14px; font-family: inherit; outline: none;
            transition: all .15s; background: #f8fafc;
        }
        input:focus { border-color: #6366f1; background: white; box-shadow: 0 0 0 4px rgba(99,102,241,0.1); }
        .btn {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white; border: none; border-radius: 10px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            margin-top: 10px; box-shadow: 0 8px 16px rgba(99,102,241,0.3);
            transition: all .15s; font-family: inherit;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(99,102,241,0.4); }
        .errors {
            background: #fee2e2; color: #991b1b; padding: 10px 14px;
            border-radius: 10px; font-size: 13px; margin-bottom: 16px;
            border: 1px solid #fca5a5;
        }
        .info {
            margin-top: 22px; padding: 12px;
            background: #f8fafc; border-radius: 10px;
            font-size: 12px; color: #64748b; text-align: center; line-height: 1.6;
        }
    
        @media (max-width: 480px) {
            .card, .login-card, .box { padding: 26px 20px !important; }
            body { padding: 14px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <div class="logo-icon">🎯</div>
            <div>
                <div class="logo-text">LeadHunt</div>
                <div class="logo-sub">Lead Generation Suite</div>
            </div>
        </div>

        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to access your dashboard</p>

        {% if form.errors %}
            <div class="errors">⚠️ Invalid username or password. Please try again.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" autofocus required>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn">🔐 Sign In</button>
        </form>

        <div class="info">
            🔒 Authorized access only · Powered by Django Auth
        </div>
    </div>
</body>
</html>
