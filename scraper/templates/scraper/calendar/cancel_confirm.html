{% load static %}
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cancel Meeting</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Inter,sans-serif;background:#f1f5f9;display:grid;place-items:center;padding:24px;min-height:100vh;}.card{max-width:480px;background:white;border-radius:18px;padding:36px;box-shadow:0 20px 50px rgba(0,0,0,0.1);text-align:center;}h1{margin:0 0 12px;font-size:24px;}p{color:#64748b;}</style>
</head><body><div class="card">
<h1>⚠️ Cancel This Meeting?</h1>
<p>This will cancel your booking with <strong>{{ schedule.user.username }}</strong> on <strong>{{ meeting.scheduled_at|date:'D, d M Y at h:i A' }}</strong>.</p>
<form method="post" style="margin-top:18px;">
{% csrf_token %}
<button type="submit" style="padding:12px 28px;background:#ef4444;color:white;border:none;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;">Yes, Cancel Meeting</button>
<a href="/meet/{{ schedule.slug }}/" style="display:inline-block;margin-top:12px;color:#64748b;text-decoration:none;font-size:13px;">← Keep Meeting</a>
</form>
</div></body></html>
