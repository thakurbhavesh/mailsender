{% extends 'scraper/base.html' %}
{% block heading %}🎯 Set Goal — {{ profile.user.username }}{% endblock %}
{% block subheading %}Monthly target for {{ month_start|date:"F Y" }}{% endblock %}
{% block content %}

<a href="{% url 'goals_list' %}" style="color:var(--primary);font-weight:600;text-decoration:none;font-size:13px;">← Back to Goals</a>

<div style="background:var(--card);border-radius:14px;border:1px solid var(--border);padding:28px;margin-top:14px;max-width:560px;">
<form method="post">
    {% csrf_token %}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div style="margin-bottom:14px;">
            <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Target Calls</label>
            <input type="number" name="target_calls" value="{{ goal.target_calls }}" min="0" style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--input-bg);color:var(--text);">
        </div>
        <div style="margin-bottom:14px;">
            <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Target Conversions</label>
            <input type="number" name="target_conversions" value="{{ goal.target_conversions }}" min="0" style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--input-bg);color:var(--text);">
        </div>
    </div>
    <div style="margin-bottom:14px;">
        <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Target Revenue (₹)</label>
        <input type="number" step="0.01" name="target_revenue" value="{{ goal.target_revenue }}" min="0" style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--input-bg);color:var(--text);">
    </div>
    <div style="margin-bottom:14px;">
        <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">Notes</label>
        <textarea name="notes" rows="3" style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--input-bg);color:var(--text);">{{ goal.notes }}</textarea>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border);padding-top:18px;">
        <a href="{% url 'goals_list' %}" style="padding:10px 18px;border-radius:8px;background:var(--card-hover);color:var(--text);border:1.5px solid var(--border);font-weight:600;text-decoration:none;">Cancel</a>
        <button type="submit" style="padding:10px 22px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#4f46e5);color:white;font-weight:700;border:none;cursor:pointer;font-family:inherit;">💾 Save Goal</button>
    </div>
</form>
</div>

{% endblock %}
